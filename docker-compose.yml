services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: doorbell
      POSTGRES_USER: doorbell
      POSTGRES_PASSWORD: doorbell
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doorbell -d doorbell']
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.9.0
    depends_on:
      db:
        condition: service_healthy
    command: migrate
    environment:
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_URL: jdbc:postgresql://db:5432/doorbell
      FLYWAY_USER: doorbell
      FLYWAY_PASSWORD: doorbell
    volumes:
      - ./migrations:/flyway/sql:ro

  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: doorbell
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    ports:
      - '9090:9090'
    volumes:
      - s3mock_data:/s3mockroot
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:9090/ >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  s3mock_data:
